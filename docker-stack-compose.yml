x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  openwebui:
    # Set OWUI_TAG in .env. deploy-swarm.sh scales to 0 on a tag change (DB migrations).
    image: ghcr.io/open-webui/open-webui:${OWUI_TAG:-0.12.3}
    # No wait script — Open WebUI has internal retry logic for db/redis,
    # and the wait script causes a multi-replica Redis lock race on fresh deploys.
    volumes:
      - ${DATA_ROOT}/open-webui/data:/app/backend/data
    env_file:
      - env/owui.env
    environment:
      TZ: America/New_York
      # CORS - use "*" for allow-all (can create 500 errors w/current traefik CORS rules)
      CORS_ALLOW_ORIGIN: https://${ROUTER_NAME}.${ROOT_DOMAIN}
    networks:
      - backend
      - jupyter
      # - traefik-public  # uncomment if using Traefik as ingress
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:8080/health | jq -ne 'input.status == true' || exit 1"]
      interval: 30s
      retries: 15
      start_period: 180s
      timeout: 10s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      # Multi-node swarms only:
      # placement:
      #   max_replicas_per_node: 1
      restart_policy:
        condition: any
        delay: 15s
        max_attempts: 5
        window: 120s
      # Traefik: uncomment labels: and the entries below if using Traefik as ingress
      # labels:
        # - traefik.enable=true
        # - traefik.swarm.network=traefik-public
        # - traefik.http.routers.${ROUTER_NAME}.rule=Host(`${ROUTER_NAME}.${ROOT_DOMAIN}`)
        # - traefik.http.routers.${ROUTER_NAME}.middlewares=chain-oauth@file,${ROUTER_NAME}-nocache
        # - traefik.http.routers.${ROUTER_NAME}.service=${ROUTER_NAME}-svc
        # - traefik.http.routers.${ROUTER_NAME}-immutable.rule=Host(`${ROUTER_NAME}.${ROOT_DOMAIN}`) && PathPrefix(`/_app/immutable`)
        # - traefik.http.routers.${ROUTER_NAME}-immutable.priority=100
        # - traefik.http.routers.${ROUTER_NAME}-immutable.middlewares=chain-oauth@file,${ROUTER_NAME}-immutable
        # - traefik.http.routers.${ROUTER_NAME}-immutable.service=${ROUTER_NAME}-svc
        # - traefik.http.middlewares.${ROUTER_NAME}-nocache.headers.customresponseheaders.Cache-Control=no-cache
        # - traefik.http.middlewares.${ROUTER_NAME}-immutable.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable
        # - traefik.http.services.${ROUTER_NAME}-svc.loadbalancer.server.port=8080
        # - traefik.constraint=traefik-public
    logging: *default-logging

  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    env_file:
      - env/db.env
    user: "999:999"
    environment:
      TZ: America/New_York
    entrypoint: ["/init/entrypoint.sh"]
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      retries: 10
      start_period: 60s
      timeout: 10s
    volumes:
      - postgres:/var/lib/postgresql/data
      - ${DATA_ROOT}/open-webui/postgres/init:/init:ro
    networks:
      - backend
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
      # Multi-node swarms: pin db to the node that holds its volume
      # placement:
      #   constraints:
      #     - node.hostname == your-db-node

    logging: *default-logging

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    # Host tuning: sudo sysctl vm.overcommit_memory=1 (persist in /etc/sysctl.conf)
    environment:
      TZ: America/New_York
    volumes:
      - ${REDIS_DATA_ROOT:-${DATA_ROOT}}/open-webui/redis/data:/data
    command: "valkey-server --save 30 1 --maxmemory-policy allkeys-lru --tcp-keepalive 300"
    healthcheck:
      test: "[ $$(valkey-cli ping) = 'PONG' ]"
      start_period: 5s
      interval: 1s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    networks:
      - backend
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
    logging: *default-logging

  searxng:
    image: searxng/searxng:2026.10.16-8252c0bf6
    user: "977:977"
    entrypoint: ["/bin/sh", "/wait-for-services.sh", "redis:6379", "--", "/usr/local/searxng/entrypoint.sh"]
    env_file: env/searxng.env
    environment:
      TZ: America/New_York
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 60s
      test: ["CMD-SHELL", "wget -q -t1 -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      timeout: 10s
    cap_drop:
      - ALL
    volumes:
      - ${DATA_ROOT}/open-webui/searxng/conf/settings.yml:/etc/searxng/settings.yml:ro
      - ${DATA_ROOT}/open-webui/searxng/conf/limiter.toml:/etc/searxng/limiter.toml:ro
      - ${DATA_ROOT}/open-webui/scripts/wait-for-services.sh:/wait-for-services.sh:ro
      - searxng:/var/cache/searxng:rw
    networks:
      - backend
      # - traefik-public  # uncomment if using Traefik as ingress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
      # Traefik: uncomment labels: and the entries below if using Traefik as ingress
      # SearXNG is served under /searxng: requires SEARXNG_BASE_URL=/searxng in env/searxng.env
      # labels:
        # - traefik.enable=true
        # - traefik.swarm.network=traefik-public
        # - traefik.http.routers.searxng.rule=Host(`${ROUTER_NAME}.${ROOT_DOMAIN}`) && PathPrefix(`/searxng`)
        # - traefik.http.routers.searxng.middlewares=chain-oauth@file,searxng-stripprefix
        # - traefik.http.middlewares.searxng-stripprefix.stripPrefix.prefixes=/searxng
        # - traefik.http.routers.searxng.service=searxng-svc
        # - traefik.http.services.searxng-svc.loadbalancer.server.port=8080
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  tika:
    # TIKA_TAG must be 4.x (JSON config)
    image: apache/tika:${TIKA_TAG:-4.1.0-1}-full
    command: -c /tika-config.json
    environment:
      TZ: America/New_York
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -t1 -O /dev/null http://127.0.0.1:9998/version || exit 1"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    volumes:
      - ${DATA_ROOT}/open-webui/tika/conf/tika-config.json:/tika-config.json:ro
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 3G
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
    logging: *default-logging

  edgetts:
    # no version tags upstream; pinned by digest
    image: travisvn/openai-edge-tts:latest@sha256:af8df8fb39719623cb6c3dbcba87ab65813030d97e20ae436d3161a53d41d72a
    env_file: env/edgetts.env
    environment:
      TZ: America/New_York
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/v1/models')\" || exit 1"]
      interval: 30s
      retries: 5
      start_period: 15s
      timeout: 5s
    networks:
      - backend
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
    logging: *default-logging

  mcposerver:
    # mcpo v0.0.20
    image: ghcr.io/open-webui/mcpo:git-788ff92
    entrypoint: ["/bin/sh", "/wait-for-services.sh", "db:5432", "--"]
    command: ["mcpo", "--config", "/app/conf/config.json"]
    env_file: env/mcp.env
    environment:
      TZ: America/New_York
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 120s
      # /docs answers even when the postgres server failed to start
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/postgres/openapi.json | grep -q execute_sql || exit 1"]
      timeout: 10s
    volumes:
      - ${DATA_ROOT}/open-webui/mcposerver/conf:/app/conf:ro
      - ${DATA_ROOT}/open-webui/scripts/wait-for-services.sh:/wait-for-services.sh:ro
    networks:
      - backend
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
    logging: *default-logging

  tools-init:
    image: python:3.12-slim
    env_file: env/tools-init.env
    environment:
      TZ: America/New_York
      # first boot (migrations, function loading, pip installs) can take minutes
      WAIT_TIMEOUT: "300"
    entrypoint: ["bash", "/wait-for-services.sh", "openwebui:8080", "--"]
    command: ["bash", "-c", "apt-get update -qq && apt-get install -y -qq curl jq >/dev/null 2>&1 && exec bash /scripts/install-tools.sh"]
    volumes:
      - ${DATA_ROOT}/open-webui/tools:/tools:ro
      - ${DATA_ROOT}/open-webui/tools/install-tools.sh:/scripts/install-tools.sh:ro
      - ${DATA_ROOT}/open-webui/scripts/wait-for-services.sh:/wait-for-services.sh:ro
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 5
    logging: *default-logging

  jupyter:
    # Code interpreter kernel. One shared kernel: trusted users only.
    # Isolated network, no ingress, outbound internet allowed.
    image: quay.io/jupyter/scipy-notebook:2026-01-05
    # allow_remote_access: Open WebUI connects with a non-local Host header (403 otherwise)
    command:
      - start-notebook.py
      - --ServerApp.allow_remote_access=True
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.disable_check_xsrf=True
    env_file: env/jupyter.env
    environment:
      TZ: America/New_York
    cap_drop:
      - ALL
    volumes:
      - ${DATA_ROOT}/open-webui/jupyter:/home/jovyan/work
    networks:
      - jupyter
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
    logging: *default-logging

networks:
  backend:
    name: ${BACKEND_NETWORK_NAME}
    external: true
  jupyter:
    name: ${JUPYTER_NETWORK_NAME:-open-webui_jupyter}
    external: true
  # traefik-public:  # uncomment if using Traefik as ingress
  #   external: true

volumes:
  postgres:
    external: true
    name: ${STACK_NAME}_postgresdata
  searxng:
    external: true
    name: ${STACK_NAME}_searxngcache

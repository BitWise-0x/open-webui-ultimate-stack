x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  openwebui:
    # Override with OWUI_TAG in .env; back up the database first (DB migrations)
    image: ghcr.io/open-webui/open-webui:${OWUI_TAG:-0.12.3}
    env_file: env/owui.env
    environment:
      TZ: America/New_York
    volumes:
      - owui_data:/app/backend/data
    ports:
      - "3000:8080"
    networks:
      - backend
      - jupyter
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:8080/health | jq -ne 'input.status == true' || exit 1"]
      interval: 30s
      retries: 15
      start_period: 180s
      timeout: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Traefik (optional reverse proxy) — uncomment if using Traefik on this host
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.openwebui.rule=Host(`openwebui.your.domain.com`)
    #   - traefik.http.routers.openwebui.middlewares=chain-oauth@file
    #   - traefik.http.services.openwebui.loadbalancer.server.port=8080
    logging: *default-logging

  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    env_file: env/db.env
    user: "999:999"
    environment:
      TZ: America/New_York
    entrypoint: ["/init/entrypoint.sh"]
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      retries: 10
      start_period: 60s
      timeout: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./conf/postgres/init:/init:ro
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    # Host tuning: sudo sysctl vm.overcommit_memory=1 (persist in /etc/sysctl.conf)
    environment:
      TZ: America/New_York
    volumes:
      - redis_data:/data
    command: "valkey-server --save 30 1 --maxmemory-policy allkeys-lru --tcp-keepalive 300"
    healthcheck:
      test: "[ $$(valkey-cli ping) = 'PONG' ]"
      start_period: 5s
      interval: 1s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  searxng:
    image: searxng/searxng:2026.10.16-8252c0bf6
    user: "977:977"
    env_file: env/searxng.env
    environment:
      TZ: America/New_York
    healthcheck:
      test: ["CMD-SHELL", "wget -q -t1 -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    cap_drop:
      - ALL
    volumes:
      - searxng_cache:/var/cache/searxng:rw
      - ./conf/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./conf/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks:
      - backend
    ports:
      - "8888:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Traefik (optional)
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.searxng.rule=Host(`openwebui.your.domain.com`) && PathPrefix(`/searxng`)
    #   - traefik.http.routers.searxng.middlewares=searxng-stripprefix
    #   - traefik.http.middlewares.searxng-stripprefix.stripPrefix.prefixes=/searxng
    #   - traefik.http.services.searxng.loadbalancer.server.port=8080
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  tika:
    # TIKA_TAG must be 4.x (JSON config)
    image: apache/tika:${TIKA_TAG:-4.1.0-1}-full
    command: -c /tika-config.json
    environment:
      TZ: America/New_York
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -t1 -O /dev/null http://127.0.0.1:9998/version || exit 1"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    volumes:
      - ./conf/tika/tika-config.json:/tika-config.json:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 3G
    restart: unless-stopped
    logging: *default-logging

  edgetts:
    # no version tags upstream; pinned by digest
    image: travisvn/openai-edge-tts:latest@sha256:af8df8fb39719623cb6c3dbcba87ab65813030d97e20ae436d3161a53d41d72a
    env_file: env/edgetts.env
    environment:
      TZ: America/New_York
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/v1/models')\" || exit 1"]
      interval: 30s
      retries: 5
      start_period: 15s
      timeout: 5s
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  mcposerver:
    # mcpo v0.0.20
    image: ghcr.io/open-webui/mcpo:git-788ff92
    env_file: env/mcp.env
    environment:
      TZ: America/New_York
    command: ["mcpo", "--config", "/app/conf/config.json"]
    healthcheck:
      # /docs answers even when the postgres server failed to start
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/postgres/openapi.json | grep -q execute_sql || exit 1"]
      interval: 30s
      retries: 5
      start_period: 120s
      timeout: 10s
    volumes:
      - ./conf/mcposerver:/app/conf:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  tools-init:
    image: python:3.12-slim
    env_file: env/tools-init.env
    environment:
      TZ: America/New_York
    entrypoint:
      - bash
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq curl jq >/dev/null 2>&1 \
          && exec bash /scripts/install-tools.sh
    volumes:
      - ./conf/tools:/tools:ro
      - ./scripts/install-tools.sh:/scripts/install-tools.sh:ro
    networks:
      - backend
    depends_on:
      openwebui:
        condition: service_healthy
    restart: "on-failure:5"
    logging: *default-logging

  jupyter:
    # Code interpreter kernel. One shared kernel: trusted users only.
    # Isolated network, no published port, outbound internet allowed.
    image: quay.io/jupyter/scipy-notebook:2026-01-05
    # allow_remote_access: Open WebUI connects with a non-local Host header (403 otherwise)
    command:
      - start-notebook.py
      - --ServerApp.allow_remote_access=True
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.disable_check_xsrf=True
    env_file: env/jupyter.env
    environment:
      TZ: America/New_York
    cap_drop:
      - ALL
    volumes:
      - jupyter_work:/home/jovyan/work
    networks:
      - jupyter
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    logging: *default-logging

networks:
  backend:
    driver: bridge
  jupyter:
    driver: bridge

volumes:
  owui_data:
  postgres_data:
  redis_data:
  searxng_cache:
  jupyter_work:

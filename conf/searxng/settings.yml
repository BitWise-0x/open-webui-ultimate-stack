# Overrides merged onto the image's default settings.
# secret_key, base_url, image_proxy, valkey.url and debug come from env/searxng.env.
use_default_settings: true

general:
  instance_name: "SearXNG"

search:
  autocomplete: ""
  # json is required by Open WebUI and the image-search tool
  formats:
    - html
    - json
  suspended_times:
    SearxEngineTooManyRequests: 7200

server:
  # botdetection would block Open WebUI's python clients; put public access behind auth instead
  limiter: false
  public_instance: false
  http_protocol_version: "1.1"
  method: "POST"

outgoing:
  request_timeout: 6.0

# plugins: replaces the default list (not merged), so list every plugin
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: true
  searx.plugins.tor_check.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true


# Overrides merged onto searx/limiter.toml
# Docs: https://docs.searxng.org/admin/searx.limiter.html

[botdetection]

ipv4_prefix = 32
ipv6_prefix = 48

# Client IP is taken from X-Forwarded-For only when the peer is listed here
# (even with the limiter off). Narrow 10.0.0.0/8 to your proxy's subnet if known.
trusted_proxies = [
  '127.0.0.0/8',
  '::1',
  '10.0.0.0/8',
]

[botdetection.ip_limit]

filter_link_local = false
link_token = false

[botdetection.ip_lists]

block_ip = []

# If you enable the limiter, add the backend subnet (FORWARDED_ALLOW_IPS) here
pass_ip = [
]

pass_searxng_org = true
